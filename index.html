<!doctype html>
<html lang="en" class="scroll-smooth" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Shree's Bakery</title>
    <meta name="title" content="Shree's Bakery" />
    <meta name="description" content="Order fresh customized birthday, wedding, anniversary & celebration cakes in 1/2 KG & 1 KG. Design interactive 3D cakes online or order via WhatsApp: 87086 61381." />
    <meta name="keywords" content="Shree's Bakery, custom cakes, 3D cake studio, birthday cake, wedding cake, celebration cake, order cake online, bakery 8708661381" />
    <meta name="author" content="Shree's Bakery" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / WhatsApp / Instagram / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shree's Bakery" />
    <meta property="og:title" content="Shree's Bakery" />
    <meta property="og:description" content="Order fresh customized birthday, wedding, anniversary & celebration cakes in 1/2 KG & 1 KG. Interactive 3D cake design & instant WhatsApp ordering (87086 61381)." />
    <meta property="og:url" content="/" />

    <!-- Square preview image (Optimized for WhatsApp / Telegram chat thumbnails, <300KB) -->
    <meta property="og:image" content="/og-image-square.png" />
    <meta property="og:image:secure_url" content="/og-image-square.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="400" />
    <meta property="og:image:height" content="400" />
    <meta property="og:image:alt" content="Shree's Bakery Logo" />

    <!-- Landscape banner (Optimized for Facebook, LinkedIn, Twitter/X cards, 1200x630) -->
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:secure_url" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shree's Bakery" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shree's Bakery" />
    <meta name="twitter:description" content="Order fresh customized birthday, wedding, anniversary & celebration cakes in 1/2 KG & 1 KG. Call/WhatsApp: 87086 61381." />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta name="twitter:image:alt" content="Shree's Bakery" />

    <!-- Schema.org / Google / WhatsApp microdata -->
    <meta itemprop="name" content="Shree's Bakery" />
    <meta itemprop="description" content="Order fresh customized birthday, wedding, anniversary & celebration cakes in 1/2 KG & 1 KG. Call/WhatsApp: 87086 61381." />
    <meta itemprop="image" content="/og-image-square.png" />

    <!-- Official Shree's Bakery Favicons & Mobile Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1a0c06" />
    <meta name="msapplication-TileColor" content="#1a0c06" />

    <!-- Google Fonts: Alex Brush, Cinzel, Playfair Display, Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700;800&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

    <!-- Dynamic Social Share Origin Updater -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location && window.location.origin) {
          var origin = window.location.origin;
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) {
            ogUrl.setAttribute('content', window.location.href);
          }
          var imageMetas = document.querySelectorAll('meta[property^="og:image"], meta[name^="twitter:image"], meta[itemprop="image"]');
          imageMetas.forEach(function(meta) {
            var val = meta.getAttribute('content');
            if (val && val.startsWith('/') && !val.startsWith('//')) {
              meta.setAttribute('content', origin + val);
            }
          });
        }
      })();
    </script>
  </head>
  <body class="bg-[#1a0c06] text-[#fbf6ee] selection:bg-[#d4af37] selection:text-[#1a0c06] antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
